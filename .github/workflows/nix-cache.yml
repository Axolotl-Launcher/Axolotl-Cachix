name: Nix binary cache

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Space-separated refs to build, e.g. "main experiment/linux-cef-runtime" (branch, tag, or commit); leave empty for releases + default refs'
        required: false
  schedule:
    # 15:00 Asia/Shanghai (07:00 UTC) and 03:00 Asia/Shanghai (19:00 UTC).
    # GitHub disables scheduled workflows after 60 days of repository inactivity.
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"

permissions:
  contents: read

env:
  # Flake attribute to resolve (default == axolotl-launcher == symlinkJoin { enwrap desktop }).
  BUILD_ATTR: default
  # Strict pnpm-deps store-name pattern (grep -E). The leading "-" means callers
  # must use `grep -E -e "$PAT"`, otherwise grep treats it as an option.
  PNPM_DEPS_PATTERN: '-axolotl-pnpm-deps'
  # CACHIX_PUSH_PATTERN is composed below as "-axolotl-<version_fmt>" (from config.json).

jobs:
  cache:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    # Serialize per system so the x86_64 and aarch64 jobs can run in parallel
    # without overlapping runs building the same store paths.
    concurrency:
      group: nix-cache-${{ matrix.system }}
      cancel-in-progress: false
    env:
      SYSTEM: ${{ matrix.system }}
    steps:
      - name: Check out the config
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Load config
        id: config
        run: |
          jq -r '
            "axolotl_repo=\(.axolotl_repo)",
            "cache_store=\(.cache_store)",
            "cachix_name=\(.cachix_name)",
            "version_fmt=\(.version_fmt)",
            "default_refs=\(.default_refs | join(" "))"
          ' config.json >> "$GITHUB_OUTPUT"

      - name: Set up Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.config.outputs.cachix_name }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # We push only the Rust build output explicitly below, instead of letting
          # the daemon hook push every locally built/downloaded store path.
          skipPush: true

      - name: Build the todo list
        id: todo
        env:
          AXOLOTL_REPO: ${{ steps.config.outputs.axolotl_repo }}
          AXOLOTL_FLAKE: git+${{ steps.config.outputs.axolotl_repo }}
          CACHE_STORE: ${{ steps.config.outputs.cache_store }}
          DEFAULT_REFS: ${{ steps.config.outputs.default_refs }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          CACHIX_PUSH_PATTERN: '-axolotl-${{ steps.config.outputs.version_fmt }}'
        run: |
          source .github/scripts/common.sh

          # Find the Rust derivation (axolotl-<version>) inside the wrapper closure.
          rust_drv_of() {
            local drv
            drv="$(nix eval --raw --accept-flake-config "${AXOLOTL_FLAKE}?rev=$1#packages.${SYSTEM}.${BUILD_ATTR}.drvPath" 2>/dev/null)" || return 1
            nix-store -qR "$drv" 2>/dev/null | grep -E -e "${CACHIX_PUSH_PATTERN}" | grep -E '\.drv$' | head -1
          }

          # The pnpm-deps fixed-output derivation: its store path is independent of
          # the architecture, so x86_64 and aarch64 share the same path.
          pnpm_drv_of() {
            local drv
            drv="$(nix eval --raw --accept-flake-config "${AXOLOTL_FLAKE}?rev=$1#packages.${SYSTEM}.${BUILD_ATTR}.drvPath" 2>/dev/null)" || return 1
            nix-store -qR "$drv" 2>/dev/null | grep -E -e "${PNPM_DEPS_PATTERN}" | head -1
          }

          todo=()
          enqueue() {
            local sha="$1" drv out
            [ -z "$sha" ] && return

            for e in "${todo[@]}"; do [ "$e" = "$sha" ] && return; done

            if ! drv="$(rust_drv_of "$sha")" || [ -z "$drv" ]; then
              echo "Skipping ${sha}: no ${SYSTEM} output matching '${CACHIX_PUSH_PATTERN}'"
              return
            fi

            out="$(nix-store -q --outputs "$drv")"
            if nix path-info --store "${CACHE_STORE}" "$out" >/dev/null 2>&1; then
              echo "Already cached: ${sha} (${SYSTEM}) ${out}"
              return
            fi

            echo "Needs caching: ${sha} (${SYSTEM}) ${drv}"
            todo+=("$sha")
          }

          collect_refs
          [ ${#REFS[@]} -gt 0 ] && echo "Candidates: ${REFS[*]}"
          for ref in "${REFS[@]}"; do
            enqueue "$(sha_of "$ref")"
          done

          # <sha> <rust-drv> for each queued commit, in order.
          : > "$RUNNER_TEMP/todo"
          for sha in "${todo[@]}"; do
            [ -z "$sha" ] && continue
            drv="$(rust_drv_of "$sha")" || continue
            [ -n "$drv" ] && printf '%s %s\n' "$sha" "$drv" >> "$RUNNER_TEMP/todo"
          done
          echo "Todo (${SYSTEM}):"
          cat "$RUNNER_TEMP/todo"

          # pnpm-deps store paths needed for this todo (same on every architecture).
          for sha in "${todo[@]}"; do
            [ -z "$sha" ] && continue
            drv="$(pnpm_drv_of "$sha")" || continue
            [ -n "$drv" ] && nix-store -q --outputs "$drv"
          done | sort -u > "$RUNNER_TEMP/pnpm-deps.txt"
          echo "pnpm-deps paths:"
          cat "$RUNNER_TEMP/pnpm-deps.txt"
          echo "pnpm_cache_key=pnpm-deps-$(sha256sum "$RUNNER_TEMP/pnpm-deps.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm-deps cache
        id: pnpm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pnpm-deps-cache
          key: ${{ steps.todo.outputs.pnpm_cache_key }}

      - name: Import pnpm-deps into the store
        if: steps.pnpm-cache.outputs.cache-hit == 'true'
        run: |
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            echo "Importing ${p} from the Actions cache"
            nix copy --no-check-sigs --from "file://$RUNNER_TEMP/pnpm-deps-cache" "$p" || true
          done < "$RUNNER_TEMP/pnpm-deps.txt"

      - name: Cache the todo list in order
        env:
          CACHIX_NAME: ${{ steps.config.outputs.cachix_name }}
        run: |
          while read -r sha drv; do
            [ -z "$drv" ] && continue
            echo "::group::Caching ${sha} (${SYSTEM})"
            if ! outs="$(nix build --no-link --print-out-paths "${drv}^*")"; then
              echo "Build failed for ${sha} (${SYSTEM})"
              exit 1
            fi
            mapfile -t paths <<< "$outs"
            if [ ${#paths[@]} -eq 0 ]; then
              echo "Build for ${sha} (${SYSTEM}) produced no outputs"
              exit 1
            fi
            printf 'Pushing %s\n' "${paths[@]}"
            cachix push "${CACHIX_NAME}" "${paths[@]}"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/todo"

      - name: Export pnpm-deps from the store
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pnpm-deps-cache"
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if nix path-info "$p" >/dev/null 2>&1; then
              echo "Exporting ${p} to the Actions cache"
              nix copy --to "file://$RUNNER_TEMP/pnpm-deps-cache" "$p" || true
            fi
          done < "$RUNNER_TEMP/pnpm-deps.txt"

  report:
    needs: cache
    # Run even if a cache job failed: the report re-checks the cache itself, so
    # it stays accurate. Only skip when the whole run was cancelled.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nix-cache-readme
      cancel-in-progress: false
    env:
      SYSTEMS: x86_64-linux aarch64-linux
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Load config
        id: config
        run: |
          jq -r '
            "axolotl_repo=\(.axolotl_repo)",
            "cache_store=\(.cache_store)",
            "version_fmt=\(.version_fmt)",
            "default_refs=\(.default_refs | join(" "))"
          ' config.json >> "$GITHUB_OUTPUT"

      - name: Update README
        env:
          AXOLOTL_REPO: ${{ steps.config.outputs.axolotl_repo }}
          AXOLOTL_FLAKE: git+${{ steps.config.outputs.axolotl_repo }}
          CACHE_STORE: ${{ steps.config.outputs.cache_store }}
          DEFAULT_REFS: ${{ steps.config.outputs.default_refs }}
          CACHIX_PUSH_PATTERN: '-axolotl-${{ steps.config.outputs.version_fmt }}'
        run: bash .github/scripts/report.sh

      - name: Commit and push
        run: |
          git add README.md
          if git diff --cached --quiet -- README.md; then
            echo "README.md is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update cached commit hashes"
          git push
