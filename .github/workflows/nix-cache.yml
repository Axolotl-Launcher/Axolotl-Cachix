name: Nix binary cache

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Space-separated refs to build, e.g. "main experiment/linux-cef-runtime" (branch, tag, or commit); leave empty for releases + default refs'
        required: false
  schedule:
    - cron: "0 0/8 * * *"
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

env:
  # The launcher wrapper: symlinkJoin { enwrap desktop }.
  BUILD_ATTR: default
  # Leading "-": callers must use `grep -E -e`, or grep reads it as an option.
  PNPM_DEPS_PATTERN: '-axolotl-pnpm-deps'
  # Build failures before a commit is skipped; see .github/scripts/fail-counts.sh.
  FAIL_THRESHOLD: 3

jobs:
  cache:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    # Per system: parallel jobs, but never the same store paths at once.
    concurrency:
      group: nix-cache-${{ matrix.system }}
      cancel-in-progress: false
    env:
      SYSTEM: ${{ matrix.system }}
      BUILD_TIMEOUT: 60m
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Load config
        id: config
        run: bash .github/scripts/config.sh

      - name: Set up Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.config.outputs.cachix_name }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Pushes happen explicitly, in cache-todo.sh.
          skipPush: true

      # Restore only: actions/cache's post-step save is skipped on a failed job,
      # and an all-failure run is exactly when the bumped counts must survive.
      - name: Restore the failure counts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fail-counts-${{ matrix.system }}.txt
          # A new key every run, because the counts changed.
          key: fail-counts-${{ matrix.system }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fail-counts-${{ matrix.system }}-

      - name: Build the todo list
        id: todo
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: bash .github/scripts/todo.sh

      - name: Restore pnpm-deps cache
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-deps-cache
          key: ${{ steps.todo.outputs.pnpm_cache_key }}

      - name: Import pnpm-deps into the store
        if: steps.pnpm-cache.outputs.cache-hit == 'true'
        run: bash .github/scripts/pnpm-deps.sh import

      - name: Cache the todo list in order
        run: bash .github/scripts/cache-todo.sh

      - name: Export pnpm-deps from the store
        if: ${{ !cancelled() && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        run: bash .github/scripts/pnpm-deps.sh export

      - name: Save pnpm-deps cache
        if: ${{ !cancelled() && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-deps-cache
          key: ${{ steps.todo.outputs.pnpm_cache_key }}

      - name: Save the failure counts
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fail-counts-${{ matrix.system }}.txt
          key: fail-counts-${{ matrix.system }}-${{ github.run_id }}-${{ github.run_attempt }}

  report:
    needs: cache
    # Reports even when the cache job failed: it re-checks the cache itself.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nix-cache-readme
      cancel-in-progress: false
    env:
      SYSTEMS: x86_64-linux aarch64-linux
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # Read-only: plain actions/cache would save a new entry on the way out.
      - name: Restore the failure counts (x86_64-linux)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fail-counts-x86_64-linux.txt
          key: fail-counts-x86_64-linux-restore-${{ github.run_id }}
          restore-keys: fail-counts-x86_64-linux-

      - name: Restore the failure counts (aarch64-linux)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fail-counts-aarch64-linux.txt
          key: fail-counts-aarch64-linux-restore-${{ github.run_id }}
          restore-keys: fail-counts-aarch64-linux-

      - name: Update README
        run: bash .github/scripts/report.sh

      - name: Commit and push
        run: bash .github/scripts/commit-readme.sh
