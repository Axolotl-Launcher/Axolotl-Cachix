name: Nix binary cache

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Space-separated refs to build, e.g. "main experiment/linux-cef-runtime" (branch, tag, or commit); leave empty for releases + default refs'
        required: false
  schedule:
    # 15:00 Asia/Shanghai (07:00 UTC) and 03:00 Asia/Shanghai (19:00 UTC).
    # GitHub disables scheduled workflows after 60 days of repository inactivity.
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"

permissions:
  contents: read

jobs:
  cache:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    # Serialize per system so the x86_64 and aarch64 jobs can run in parallel
    # without overlapping runs building the same store paths.
    concurrency:
      group: nix-cache-${{ matrix.system }}
      cancel-in-progress: false
    env:
      SYSTEM: ${{ matrix.system }}
    steps:
      - name: Check out the config
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Load config
        id: config
        run: |
          jq -r '
            "axolotl_repo=\(.axolotl_repo)",
            "cache_store=\(.cache_store)",
            "cachix_name=\(.cachix_name)",
            "default_refs=\(.default_refs | join(" "))"
          ' config.json >> "$GITHUB_OUTPUT"

      - name: Set up Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.config.outputs.cachix_name }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the todo list
        env:
          AXOLOTL_REPO: ${{ steps.config.outputs.axolotl_repo }}
          AXOLOTL_FLAKE: git+${{ steps.config.outputs.axolotl_repo }}
          CACHE_STORE: ${{ steps.config.outputs.cache_store }}
          DEFAULT_REFS: ${{ steps.config.outputs.default_refs }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          source .github/scripts/common.sh

          todo=()
          enqueue() {
            local sha="$1" out
            [ -z "$sha" ] && return

            for e in "${todo[@]}"; do [ "$e" = "$sha" ] && return; done

            if ! out="$(nix eval --raw --accept-flake-config "${AXOLOTL_FLAKE}?rev=${sha}#packages.${SYSTEM}.default.outPath" 2>/dev/null)"; then
              echo "Skipping ${sha}: no buildable ${SYSTEM} flake (unsupported system or predates Nix support)"
              return
            fi

            if nix path-info --store "${CACHE_STORE}" "$out" >/dev/null 2>&1; then
              echo "Already cached: ${sha} (${SYSTEM})"
              return
            fi

            echo "Needs caching: ${sha} (${SYSTEM})"
            todo+=("$sha")
          }

          collect_refs
          [ ${#REFS[@]} -gt 0 ] && echo "Candidates: ${REFS[*]}"
          for ref in "${REFS[@]}"; do
            enqueue "$(sha_of "$ref")"
          done

          if [ ${#todo[@]} -gt 0 ]; then
            printf '%s\n' "${todo[@]}" > "$RUNNER_TEMP/todo"
          else
            : > "$RUNNER_TEMP/todo"
          fi
          echo "Todo (${SYSTEM}):"
          cat "$RUNNER_TEMP/todo"

      - name: Cache the todo list in order
        env:
          AXOLOTL_FLAKE: git+${{ steps.config.outputs.axolotl_repo }}
        run: |
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            echo "::group::Caching ${sha} (${SYSTEM})"
            nix build --accept-flake-config "${AXOLOTL_FLAKE}?rev=${sha}#packages.${SYSTEM}.default"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/todo"

  report:
    needs: cache
    # Run even if a cache job failed: the report re-checks the cache itself, so
    # it stays accurate. Only skip when the whole run was cancelled.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nix-cache-readme
      cancel-in-progress: false
    env:
      SYSTEMS: x86_64-linux aarch64-linux
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Load config
        id: config
        run: |
          jq -r '
            "axolotl_repo=\(.axolotl_repo)",
            "cache_store=\(.cache_store)",
            "default_refs=\(.default_refs | join(" "))"
          ' config.json >> "$GITHUB_OUTPUT"

      - name: Update README
        env:
          AXOLOTL_REPO: ${{ steps.config.outputs.axolotl_repo }}
          AXOLOTL_FLAKE: git+${{ steps.config.outputs.axolotl_repo }}
          CACHE_STORE: ${{ steps.config.outputs.cache_store }}
          DEFAULT_REFS: ${{ steps.config.outputs.default_refs }}
        run: bash .github/scripts/report.sh

      - name: Commit and push
        run: |
          git add README.md
          if git diff --cached --quiet -- README.md; then
            echo "README.md is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update cached commit hashes"
          git push
